name: Daily episode

on:
  schedule:
    - cron: "17 15 * * *"   # every day at 15:17 UTC (edit to taste)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      minutes:
        description: "Target length in minutes (blank = config.json)"
        required: false

permissions:
  contents: write   # to commit data/episodes.json (episode history)

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: youtube   # optional: add required reviewers to this environment for a human approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2 fonts-dejavu-core espeak-ng

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make and publish episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.minutes }}" ]; then ARGS="--minutes ${{ inputs.minutes }}"; fi
          python -m kidtoon.pipeline $ARGS

      - name: Keep the video as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            out/episode.mp4
            out/thumbnail.jpg
            out/episode.json
            out/description.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Save episode history
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git diff --cached --quiet || git commit -m "Add episode: $(jq -r '.[-1].title' data/episodes.json)"
          git push
