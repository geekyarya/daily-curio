name: Daily video + Short

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (edit to taste)
  push:                     # changing this file starts a preview run (never uploads)
    branches: [main]
    paths: [".github/preview-request"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the videos but don't upload"
        type: boolean
        default: false
      format:
        description: "Video format"
        type: choice
        options: [auto, top10, top5, story]
        default: auto
      topic:
        description: "Optional topic, e.g. 'Strange laws of medieval England' (blank = automatic)"
        required: false
        default: ""
      skip_short:
        description: "Skip the Short"
        type: boolean
        default: false

permissions:
  contents: write   # commit the video history

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: youtube   # optional: add yourself as a required reviewer for a human approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && 'true' || 'false' }}
          VIDEO_FORMAT: ${{ inputs.format || 'auto' }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_short }}" = "true" ]; then ARGS="--skip-short"; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then  # preview run: optional "format=" / "topic=" lines
            F=$(sed -n 's/^format=//p' .github/preview-request | head -1)
            T=$(sed -n 's/^topic=//p' .github/preview-request | head -1)
            export VIDEO_FORMAT="${F:-$VIDEO_FORMAT}" VIDEO_TOPIC="${T:-$VIDEO_TOPIC}"
          fi
          python -m curio.pipeline $ARGS

      - name: Keep the videos as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/video.mp4
            out/short.mp4
            out/thumbnail.jpg
            out/video.json
            out/video.srt
            out/description.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Save video history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "Video: $(jq -r '.[-1].title // "update"' data/videos.json)"
          git pull --rebase -q && git push
